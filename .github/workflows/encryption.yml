name: encryption

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  m4-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装可选依赖（cryptography / argon2-cffi）
        run: python -m pip install -r impl/m4/requirements-m4.txt

      - name: 单元测试：KAT + 负向矩阵
        run: python -m unittest discover -s impl/m4/tests -v

      - name: 端到端：加密 → 解密 → 断言
        run: |
          set -euo pipefail
          python impl/m1/syspersona.py --home ./sim init --persona examples/persona.m1.json
          python impl/m1/syspersona.py --home ./sim chat --say "我在做一个 NAS 调优项目"

          echo "correct horse battery staple" | python impl/m1/syspersona.py vault seal --home ./sim --out ./me.vault --passphrase-stdin
          python impl/m1/syspersona.py vault inspect --file ./me.vault

          echo "correct horse battery staple" | python impl/m1/syspersona.py vault verify --file ./me.vault --passphrase-stdin
          echo "correct horse battery staple" | python impl/m1/syspersona.py vault unlock --file ./me.vault --home ./sim2 --passphrase-stdin

          test "$(sha256sum ./sim/memory.db | cut -d' ' -f1)" = "$(sha256sum ./sim2/memory.db | cut -d' ' -f1)"
          echo "memory.db 哈希一致"

      - name: 篡改与错口令必须失败
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; d=bytearray(Path('me.vault').read_bytes()); d[-1]^=1; Path('bad.vault').write_bytes(d)"

          if echo "correct horse battery staple" | python impl/m1/syspersona.py vault verify --file ./bad.vault --passphrase-stdin; then
            echo "篡改竟然通过了"; exit 1
          fi
          if echo "wrong passphrase" | python impl/m1/syspersona.py vault verify --file ./me.vault --passphrase-stdin; then
            echo "错口令竟然通过了"; exit 1
          fi
          echo "篡改与错口令均按预期失败"
